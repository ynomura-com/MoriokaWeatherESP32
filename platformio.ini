; PlatformIO Project Configuration File
;
; 盛岡市 気象情報ディスプレイ
; ESP32 Development Board (CH340C Type-C版) + GC9A01 (240x240 円形ディスプレイ)
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; ---- 使用ライブラリ (ビルド時に自動取得) ----
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    olikraus/U8g2 @ ^2.35.30
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    adafruit/Adafruit GFX Library @ ^1.11.9

; ---- TFT_eSPI 設定 ----
; Arduino IDE 版で使っていた User_Setup.h の書き換えは不要です。
; USER_SETUP_LOADED=1 を定義すると、TFT_eSPI は自前の User_Setup.h を
; 読み込まず、ここで定義したビルドフラグをそのまま設定として使います。
; ライブラリ本体を一切変更しないため、ライブラリを更新しても
; 設定が消えたり壊れたりしません。
build_flags =
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1

    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240

    ; ---- 配線 (依頼内容の接続表に対応) ----
    -DTFT_MISO=-1
    -DTFT_MOSI=2     ; SDA
    -DTFT_SCLK=15    ; SCL
    -DTFT_CS=16      ; CS
    -DTFT_DC=4       ; DC
    -DTFT_RST=17     ; RST
    -DTFT_BL=-1      ; バックライト制御ピンなし (常時点灯モジュール想定)

    ; ---- フォント ----
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1   ; 7セグメント風フォント (気温の大きな数字表示に使用)
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; ---- SPI速度 ----
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; 書き込みポートを自動検出できない場合は、以下のコメントを外して
; ご自身の環境のポート名 (例: /dev/cu.usbserial-XXXX) を指定してください。
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX
